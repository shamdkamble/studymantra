<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="StudyMantra — the HSC Maharashtra ledger for Class 11 and 12. Track chapters, backlog, revision, tests, and exam readiness.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#10233c">
  <meta name="application-name" content="StudyMantra">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyMantra">
  <title>StudyMantra</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("sm-theme");
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        var wide = matchMedia("(min-width: 961px)").matches;
        var stored = localStorage.getItem("sm-nav");
        var navOpen = wide ? stored !== "closed" : false;
        document.documentElement.dataset.sidebar = navOpen ? "open" : "closed";
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toaster"></div>
  <div id="modal-root" hidden></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
